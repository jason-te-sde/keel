name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compiles with -Werror, runs every test, and enforces that each declared
      # module exists and that dependency versions converge across modules.
      - name: verify
        run: mvn -B -ntp verify

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify -Dcoverage
      - name: summary
        run: |
          for f in $(find . -name jacoco.csv); do
            awk -F, -v f="$f" 'NR>1 {miss+=$4; cov+=$5} END {
              if (miss+cov > 0) printf "%-40s %6.1f%% lines\n", f, 100*cov/(miss+cov)
            }' "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '**/target/site/jacoco/**'
          retention-days: 7

  # A clean clone must build with nothing but a JDK and Maven. An earlier
  # project of mine declared a module that was never committed, which meant the
  # published repository could not be built at all; this job is the guard.
  clean-clone:
    name: clean clone builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: build without a warm cache
        run: mvn -B -ntp -Dmaven.repo.local=/tmp/fresh-repo package -DskipTests
