name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    # The whole job takes about a minute. Anything approaching this is hung, and the six hour default
    # means a hung job holds a runner for an afternoon before anyone notices.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compiles with -Werror, runs every test, and enforces that each declared
      # module exists and that dependency versions converge across modules.
      - name: verify
        run: mvn -B -ntp verify

      # Surefire already writes the failing assertion and its stack trace to disk. Without this they
      # are deleted when the job ends, and the summary says only that Maven exited non-zero, so
      # diagnosing a red run means downloading the raw log and grepping it.
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify -Dcoverage
      - name: summary
        run: |
          for f in $(find . -name jacoco.csv); do
            awk -F, -v f="$f" 'NR>1 {miss+=$4; cov+=$5} END {
              if (miss+cov > 0) printf "%-40s %6.1f%% lines\n", f, 100*cov/(miss+cov)
            }' "$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: '**/target/site/jacoco/**'
          retention-days: 7
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-coverage
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # The container story is claimed in the README and the operations guide, so it is checked rather
  # than asserted. This job builds the image and brings up the real three-node compose stack,
  # because a Dockerfile that has never been built is documentation of an intention.
  container:
    name: container stack works
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Cached across runs because the image is a multi stage build whose first stage resolves the
      # whole Maven dependency tree. Without a cache that download is repeated on every pull request
      # and is most of the job's wall time.
      - name: build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: keel:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --wait blocks until every service reports healthy, which is the Dockerfile's own /readyz
      # check. If a node cannot serve a read, this fails here instead of in the next step.
      - name: bring up three nodes
        run: docker compose up -d --wait

      - name: write and read through the cluster
        run: |
          docker compose run --rm keelctl status
          docker compose run --rm keelctl put greeting hello
          value=$(docker compose run --rm keelctl get greeting | tr -d '\r\n')
          echo "read back: '$value'"
          test "$value" = "hello"

      - name: metrics endpoint is scrapeable
        run: |
          curl -sf http://127.0.0.1:9101/metrics | grep -q 'keel_raft_role{role="leader"}'
          curl -sf http://127.0.0.1:9101/readyz

      - name: kill the leader and read the value back
        run: |
          leader=$(scripts/leader-of.sh 1 2 3)
          echo "killing node $leader"
          docker kill "keel-$leader"

          # Wait for one of the survivors to win the election. Asking the survivors specifically
          # matters: the killed node's metrics port is gone, and a connection refused there is the
          # expected outcome rather than a failure to report.
          survivors=$(for n in 1 2 3; do [ "$n" = "$leader" ] || printf '%s ' "$n"; done)
          for i in $(seq 1 30); do
            # shellcheck disable=SC2086
            if new_leader=$(scripts/leader-of.sh $survivors); then
              echo "node $new_leader took over after $i attempts"
              break
            fi
            sleep 2
          done
          test -n "${new_leader:-}"

          value=$(docker compose run --rm keelctl get greeting | tr -d '\r\n')
          test "$value" = "hello"

      # Always, not only on failure: when this job goes red the first question is whether the
      # containers were even running, and the answer should not require re-running it.
      - name: container state
        if: always()
        run: |
          docker compose ps
          echo "--- health ---"
          for n in keel-1 keel-2 keel-3; do
            echo "$n: $(docker inspect --format '{{json .State.Health}}' $n 2>/dev/null | head -c 600)"
          done
          echo "--- readyz from the host ---"
          curl -sS -o - -w '\nHTTP %{http_code}\n' http://127.0.0.1:9101/readyz || true
          echo "--- logs ---"
          docker compose logs --no-color --tail=120

      - name: tear down
        if: always()
        run: docker compose down -v

  # A clean clone must build with nothing but a JDK and Maven. An earlier
  # project of mine declared a module that was never committed, which meant the
  # published repository could not be built at all; this job is the guard.
  clean-clone:
    name: clean clone builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: build without a warm cache
        run: mvn -B -ntp -Dmaven.repo.local=/tmp/fresh-repo package -DskipTests
