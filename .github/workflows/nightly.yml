name: Nightly soak

# The per-pull-request suite runs a fixed set of simulation seeds so it stays fast.
# This job sweeps a far wider range, which is where a rare interleaving actually
# turns up. A failure here prints a seed that reproduces the run exactly.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of simulation seeds'
        required: false
        default: '2000'

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: install modules
        run: mvn -B -ntp install -DskipTests
      - name: soak
        run: >
          mvn -B -ntp test -pl keel-testkit
          -Dkeel.sim.seeds=${{ github.event.inputs.seeds || '2000' }}
          -Dtest=SoakTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Denforcer.skip=true

      # A soak failure names the seed that reproduces it and dumps the cluster state at the point of
      # the violation. That output is the entire value of the run, so it is kept rather than left in
      # a log that ages out.
      - name: soak report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-reports
          path: 'keel-testkit/target/surefire-reports/**'
          retention-days: 30
